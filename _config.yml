# Site
locale: "en-US"
title: "Hang Yang"
name: "Hang Yang"
description: "Hang Yang — PhD candidate in Mathematics at UMass Amherst. Machine learning, invertible neural networks, robotics."
url: https://yanghangAI.github.io
baseurl: ""
repository: "yanghangAI/yanghangAI.github.io"
timezone: America/New_York

# Author — used only by the footer
author:
  name: "Hang Yang"
  email: "hangyang@umass.edu"
  github: "yanghangAI"
  googlescholar: "https://scholar.google.com/citations?user=usu8YBAAAAAJ"

# Build
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

include:
  - _pages

# Plugins (subset GitHub Pages supports)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  tools:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: archive
  - scope:
      path: ""
      type: publications
    values:
      layout: single
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docs/
  - scripts/
  - vendor/
  - node_modules/
