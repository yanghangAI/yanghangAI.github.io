---
layout: default
---
<article class="page">
  {% if page.kicker %}<p class="page__kicker">{{ page.kicker }}</p>{% endif %}
  {% if page.title and page.hide_title != true %}
    <h1 class="page__title">{{ page.title }}</h1>
  {% endif %}
  {% if page.lede %}<p class="page__lede">{{ page.lede }}</p>{% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
