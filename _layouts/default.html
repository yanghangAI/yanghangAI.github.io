<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | strip_html }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% if page.description or page.excerpt or site.description %}
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
  {% endif %}

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} feed" href="{{ '/feed.xml' | absolute_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/brutal.css' | relative_url }}">
</head>
<body>
  {% include masthead.html %}
  <main class="shell" id="main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
